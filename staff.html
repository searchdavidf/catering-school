<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Dashboard — Catering School</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;500;600;700&family=Fira+Code:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="logo">Catering<span>School</span></div>
    <div style="display:flex;gap:8px;align-items:center;">
      <a href="index.html" class="btn btn-sm btn-secondary">Home</a>
      <button onclick="Auth.signOut()" class="btn btn-sm btn-secondary">Logout</button>
    </div>
  </header>

  <div class="container">
    <h1 style="margin:20px 0 8px;">Staff Dashboard</h1>
    <p style="color:var(--text-muted);margin-bottom:20px;">Review and approve incoming orders</p>

    <!-- Stats -->
    <div class="grid grid-4" style="margin-bottom:20px;">
      <div class="glass-card" style="text-align:center;">
        <div style="font-size:2rem;font-weight:700;color:var(--warning);" id="pendingCount">0</div>
        <div style="color:var(--text-muted);font-size:0.85rem;">Pending</div>
      </div>
      <div class="glass-card" style="text-align:center;">
        <div style="font-size:2rem;font-weight:700;color:var(--success);" id="approvedCount">0</div>
        <div style="color:var(--text-muted);font-size:0.85rem;">Approved</div>
      </div>
      <div class="glass-card" style="text-align:center;">
        <div style="font-size:2rem;font-weight:700;color:var(--info);" id="preparingCount">0</div>
        <div style="color:var(--text-muted);font-size:0.85rem;">Preparing</div>
      </div>
      <div class="glass-card" style="text-align:center;">
        <div style="font-size:2rem;font-weight:700;color:var(--success);" id="deliveredCount">0</div>
        <div style="color:var(--text-muted);font-size:0.85rem;">Delivered</div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" onclick="StaffDashboard.switchTab('pending')">Pending</button>
      <button class="tab" onclick="StaffDashboard.switchTab('approved')">Approved</button>
      <button class="tab" onclick="StaffDashboard.switchTab('all')">All Orders</button>
    </div>

    <!-- Orders List -->
    <div id="ordersList"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/staff.js"></script>
</body>
</html>
